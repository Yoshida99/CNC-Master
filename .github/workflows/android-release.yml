name: Android validation and release

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, for example 0.2.0"
        required: true
        default: "0.2.0"

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[update-meta]')
    runs-on: ubuntu-latest

    env:
      CNC_STORE_PASSWORD: ${{ secrets.CNC_KEYSTORE_PASSWORD }}
      CNC_KEY_ALIAS: ${{ secrets.CNC_KEY_ALIAS }}
      CNC_KEY_PASSWORD: ${{ secrets.CNC_KEY_PASSWORD }}
      CNC_KEYSTORE_BASE64: ${{ secrets.CNC_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Detect permanent signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        shell: bash
        run: |
          if [ -n "$CNC_KEYSTORE_BASE64" ] && [ -n "$CNC_STORE_PASSWORD" ] && [ -n "$CNC_KEY_ALIAS" ] && [ -n "$CNC_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Permanent signing secrets are not configured. This run can validate the app, but its temporary debug APK must not be used as an update base."
          fi

      - name: Restore permanent signing key
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          echo "$CNC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cnc-master-release.jks"
          echo "CNC_SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/cnc-master-release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload permanently signed test APK
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        with:
          name: CNC-Master-permanent-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload temporary validation APK
        uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready != 'true'
        with:
          name: CNC-Master-temporary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build unsigned release APK
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PCNC_VERSION_CODE="$GITHUB_RUN_NUMBER" \
            -PCNC_VERSION_NAME="$RELEASE_VERSION"

      - name: Sign release APK with the same permanent key
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/cnc-master-release.jks" \
            --ks-key-alias "$CNC_KEY_ALIAS" \
            --ks-pass env:CNC_STORE_PASSWORD \
            --key-pass env:CNC_KEY_PASSWORD \
            --out app/build/outputs/apk/release/CNC-Master.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/CNC-Master.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        with:
          name: CNC-Master-signed-apk
          path: app/build/outputs/apk/release/CNC-Master.apk

      - name: Publish GitHub release and version manifest
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="$RELEASE_VERSION"
          TAG="v$VERSION_NAME"
          APK="app/build/outputs/apk/release/CNC-Master.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_SIZE="$(stat -c%s "$APK")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Choose another version."
            exit 1
          fi

          gh release create "$TAG" "$APK#CNC-Master.apk" \
            --title "CNC Master $VERSION_NAME" \
            --notes-file update-changelog.txt

          export VERSION_CODE VERSION_NAME TAG APK_SHA256 APK_SIZE PUBLISHED_AT
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          changelog = []
          for raw in Path("update-changelog.txt").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              item = line.removeprefix("-").strip()
              if item:
                  changelog.append(item)

          payload = {
              "available": True,
              "latest_version_code": int(os.environ["VERSION_CODE"]),
              "latest_version_name": os.environ["VERSION_NAME"],
              "min_supported_version_code": 1,
              "mandatory": False,
              "download_url": f"https://github.com/Yoshida99/CNC-Master/releases/download/{os.environ['TAG']}/CNC-Master.apk",
              "sha256": os.environ["APK_SHA256"],
              "size_bytes": int(os.environ["APK_SIZE"]),
              "changelog": changelog[:8],
              "published_at": os.environ["PUBLISHED_AT"],
          }
          Path("update/version.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/version.json
          git commit -m "chore: publish CNC Master $VERSION_NAME [update-meta]"
          git push origin HEAD:main
